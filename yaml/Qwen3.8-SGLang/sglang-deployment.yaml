apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang-qwen3-8b
  namespace: sglang
  labels:
    app: sglang-qwen3-8b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sglang-qwen3-8b
  template:
    metadata:
      labels:
        app: sglang-qwen3-8b
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.present
                operator: In
                values:
                - "true"
      initContainers:
      - name: model-puller
        image: minio/mc:RELEASE.2025-08-13T08-35-41Z
        env:
        - name: MINIO_ENDPOINT
          value: "http://minio.minio.svc.cluster.local:9000"
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: MINIO_ACCESS_KEY
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: MINIO_SECRET_KEY
        command:
        - sh
        - -c
        - |
          set -e
          # 配置 MinIO 别名
          mc alias set models $MINIO_ENDPOINT $MINIO_ACCESS_KEY $MINIO_SECRET_KEY
          MODEL_DIR=/data/models/Qwen/Qwen3-8B-AWQ
          mkdir -p $MODEL_DIR
          # 从MinIO增量同步到PVC挂载路径
          mc mirror --overwrite --remove models/llm-models/Qwen/Qwen3-8B-AWQ $MODEL_DIR/
          ls -al $MODEL_DIR
        volumeMounts:
        - name: model-storage
          mountPath: /data/models
        resources:
          limits:
            memory: "1Gi"
            cpu: "2"
          requests:
            memory: "512Mi"
            cpu: "500m"
      containers:
      - name: sglang
        image: lmsysorg/sglang:latest-runtime
        command: [python3, -m, sglang.launch_server]
        args:
          - --served-model-name
          - qwen3-8b-awq
          - --model-path
          - /data/models/Qwen/Qwen3-8B-AWQ
          - --tp-size=1
          - --enable-metrics
          - --enable-mfu-metrics
          - --host=0.0.0.0
          - --port=30000
        ports:
          - containerPort: 30000
            name: http
            protocol: TCP
        resources:
          limits:
            nvidia.com/gpu: "1"
            memory: "12Gi"
            cpu: "4"
          requests:
            nvidia.com/gpu: "1"
            memory: "6Gi"
            cpu: "4"
        volumeMounts:
          - name: model-storage
            mountPath: /data/models
            readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: 30000
          initialDelaySeconds: 300
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 30000
          initialDelaySeconds: 120
          periodSeconds: 15
          timeoutSeconds: 5
        startupProbe:
          httpGet:
            path: /health
            port: 30000
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 60
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: qwen3-8b-model-pvc-sglang
---
apiVersion: v1
kind: Service
metadata:
  name: sglang-service
  namespace: sglang
spec:
  type: ClusterIP
  selector:
    app: sglang-qwen3-8b
  ports:
    - port: 30000
      targetPort: 30000
      name: http
---
